name: Deploy FinTrack to GitHub Pages

# Solo manual. El despliegue real vive en Cloudflare Pages, que construye
# desde este mismo repositorio en cada push. Mantener los dos activos
# publicaba dos copias del sitio con configuracion distinta, y la de GitHub
# Pages ademas no puede ejecutar functions/api/claude.js, asi que el analisis
# por foto no funciona ahi. Se conserva el workflow como salida de emergencia.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject environment variables
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          AGENCIA_SPREADSHEET_ID: ${{ secrets.AGENCIA_SPREADSHEET_ID }}
          AGENCIA_DRIVE_ID: ${{ secrets.AGENCIA_DRIVE_ID }}
        run: sh build.sh

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
